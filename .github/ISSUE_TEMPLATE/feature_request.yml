name: 功能建议
description: 提出不包含真实案例或私密资料的改进建议。
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出改进建议。请只描述通用、非个人化的使用场景；不要提交真实出生资料、私密导出、日志、本机路径、联系方式、环境变量、密钥或令牌。

        项目只提供排盘计算与核验底稿，不生成吉凶断语或专业意见。请先阅读 [贡献指南](https://github.com/liver-detox/bazi-ziwei-calculator/blob/main/CONTRIBUTING.md) 与 [隐私规则](https://github.com/liver-detox/bazi-ziwei-calculator/blob/main/PRIVACY.md)。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题或使用场景
      description: 请用通用且完全去个人化的方式说明。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 如能说明功能边界、交互或公开资料要求，会更有帮助。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私与范围确认
      options:
        - label: 我已阅读贡献和隐私规则，并确认本 Issue 不含任何真实案例或个人、设备、凭据信息。
          required: true
        - label: 我理解本项目不提供吉凶断语、专业意见或云端同步功能。
          required: true
